<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>راهنمای جامع بالینی داروها</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- فونت استاندارد وزیرمتن -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --text: #f8fafc;
      --card-bg: #1e293b;
      --card-border: #334155;
      --primary: #0284c7;
      --primary-text: #ffffff;
      --accent-title: #38bdf8;
      --input-bg: #1e293b;
      --modal-bg: rgba(15, 23, 42, 0.98);
    }

    [data-theme="light"] {
      --bg: #f8fafc;
      --text: #0f172a;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --primary: #0284c7;
      --primary-text: #ffffff;
      --accent-title: #0284c7;
      --input-bg: #ffffff;
      --modal-bg: rgba(248, 250, 252, 0.98);
    }

    * {
      box-sizing: border-box;
      font-family: 'Vazirmatn', system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.15s ease;
    }

    html, body {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden; /* جلوگیری قطعی از اسکرول افقی */
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 12px;
      font-size: 13.5px;
      line-height: 1.5;
      -webkit-tap-highlight-color: transparent;
    }

    /* نوار بالا */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      width: 100%;
    }

    .page-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--accent-title);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .theme-toggle-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 5px 12px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 600;
    }

    .theme-toggle-btn:active {
      transform: scale(0.96);
    }

    /* تب‌های سن */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      width: 100%;
    }

    .tab-btn {
      flex: 1;
      padding: 9px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text);
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
      text-align: center;
    }

    .tab-btn.active {
      background: var(--primary);
      color: var(--primary-text);
      border-color: var(--primary);
      box-shadow: 0 3px 8px rgba(2, 132, 199, 0.3);
    }

    /* سرچ باکس */
    .search-box {
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: var(--input-bg);
      color: var(--text);
      outline: none;
      margin-bottom: 12px;
      font-size: 13px;
    }

    .search-box:focus {
      border-color: var(--accent-title);
    }

    /* چیپ‌ها (فقط این ردیف به صورت افقی اسکرول نرم می‌خورد) */
    .cat-chips {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 12px;
      width: 100%;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .cat-chips::-webkit-scrollbar {
      display: none;
    }

    .chip {
      flex-shrink: 0;
      padding: 5px 12px;
      border-radius: 16px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
    }

    .chip.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    /* شبکه کارت‌ها - ریسپانسیو و بدون خروج از صفحه */
    .drug-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr)); /* تضمین عدم سرریز از عرض گوشی */
      gap: 8px;
      width: 100%;
    }

    .drug-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0; /* جلوگیری از کشیدگی توسط متن‌های بدون فاصله */
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    .drug-card:active {
      transform: scale(0.97);
    }

    .drug-card h4 {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent-title);
      margin-bottom: 4px;
      line-height: 1.4;
      hyphens: auto;
    }

    .drug-card span {
      font-size: 11px;
      opacity: 0.75;
      font-style: italic;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2; /* نهایتا در دو خط نمایش داده شود */
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* مدال نمایش کامل جزییات */
    #detail-view {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--modal-bg);
      backdrop-filter: blur(8px);
      padding: 14px;
      overflow-y: auto;
      overflow-x: hidden;
      z-index: 100;
      width: 100vw;
      height: 100vh;
    }

    .section-box {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 12px;
      margin-top: 8px;
      border: 1px solid var(--card-border);
      width: 100%;
      word-break: break-word;
    }

    .section-title {
      font-weight: 700;
      font-size: 13px;
      color: var(--accent-title);
      margin-bottom: 4px;
    }

    .section-desc {
      font-size: 12.5px;
      line-height: 1.6;
      text-align: justify;
    }

    .back-btn {
      margin-bottom: 12px;
      padding: 7px 14px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: var(--text);
      cursor: pointer;
      font-weight: 700;
      font-size: 12.5px;
    }

    .detail-header-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="page-title">
      <span>💉</span>
      <span>راهنمای جامع داروها</span>
    </div>
    <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()">
      <span id="themeIcon">☀️</span>
      <span id="themeLabel">روز</span>
    </button>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchAge('adult')">👨‍🦰 بزرگسالان</button>
    <button class="tab-btn" onclick="switchAge('pediatric')">👶 اطفال و نوزادان</button>
  </div>

  <input type="text" id="searchInput" class="search-box" placeholder="🔍 جستجوی نام دارو..." oninput="filterDrugs()">

  <div class="cat-chips" id="catChips"></div>

  <div class="drug-grid" id="drugList"></div>

  <!-- شناسنامه دارو -->
  <div id="detail-view">
    <button class="back-btn" onclick="closeDetail()">🔙 بازگشت به فهرست</button>
    <div id="detail-content"></div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    function initTheme() {
      const savedTheme = localStorage.getItem('app_theme') || (tg?.colorScheme || 'dark');
      applyTheme(savedTheme);
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
      const target = current === 'dark' ? 'light' : 'dark';
      applyTheme(target);
      localStorage.setItem('app_theme', target);
    }

    function applyTheme(theme) {
      if (theme === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
        document.getElementById('themeIcon').innerText = '🌙';
        document.getElementById('themeLabel').innerText = 'شب';
      } else {
        document.documentElement.removeAttribute('data-theme');
        document.getElementById('themeIcon').innerText = '☀️';
        document.getElementById('themeLabel').innerText = 'روز';
      }
    }

    initTheme();

    let currentAge = 'adult';
    let currentCat = 'all';
    let drugsCache = { adult: {}, pediatric: {} };

    const drugClasses = {
      "all": "همه داروها",
      "antidotes": "🛡️ آنتی‌دوت‌ها",
      "anesthesia": "💉 بیهوشی",
      "antiarrhythmic": "🫀 آنتی‌آریتمی",
      "antiemetic": "🤢 ضدتهوع",
      "antibiotic": "🦠 آنتی‌بیوتیک",
      "inotropes_vasopressors": "⚡ وازوپرسور/اینوتروپ",
      "Anticonvulsant": "🧠 ضدتشنج",
      "Opioids": "مخدرها",
      "others": "🩺 سایر"
    };

    async function loadData() {
      try {
        const resA = await fetch('drugs.json');
        drugsCache.adult = await resA.json();
      } catch (e) { console.warn("Adult DB load failed", e); }

      try {
        const resP = await fetch('pediatric_drugs.json');
        drugsCache.pediatric = await resP.json();
      } catch (e) { console.warn("Pediatric DB load failed", e); }

      renderCategories();
      renderDrugs();
    }

    function switchAge(age) {
      currentAge = age;
      document.querySelectorAll('.tab-btn').forEach((b, idx) => {
        b.classList.toggle('active', (age === 'adult' && idx === 0) || (age === 'pediatric' && idx === 1));
      });
      renderDrugs();
    }

    function renderCategories() {
      const container = document.getElementById('catChips');
      container.innerHTML = '';
      for (const [key, label] of Object.entries(drugClasses)) {
        const chip = document.createElement('div');
        chip.className = `chip ${key === currentCat ? 'active' : ''}`;
        chip.innerText = label;
        chip.onclick = () => {
          currentCat = key;
          document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
          renderDrugs();
        };
        container.appendChild(chip);
      }
    }

    function renderDrugs() {
      const list = document.getElementById('drugList');
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      const drugs = drugsCache[currentAge] || {};
      list.innerHTML = '';

      const entries = Object.entries(drugs);
      if (entries.length === 0) {
        list.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; padding: 20px; opacity: 0.6;">داده‌ای یافت نشد.</div>';
        return;
      }

      for (const [key, item] of entries) {
        const faName = item.fa_name || key;
        const enName = item.name || '';
        const cat = item.category || 'others';

        if (currentCat !== 'all') {
          const matchCat = Array.isArray(cat) ? cat.includes(currentCat) : cat === currentCat;
          if (!matchCat) continue;
        }

        if (q && !faName.toLowerCase().includes(q) && !enName.toLowerCase().includes(q) && !key.toLowerCase().includes(q)) {
          continue;
        }

        const card = document.createElement('div');
        card.className = 'drug-card';
        card.innerHTML = `<h4>💊 ${faName}</h4><span>${enName}</span>`;
        card.onclick = () => openDetail(item, faName, enName);
        list.appendChild(card);
      }
    }

    function filterDrugs() { renderDrugs(); }

    function openDetail(item, faName, enName) {
      const dv = document.getElementById('detail-view');
      const dc = document.getElementById('detail-content');

      const secKeys = [
        { t: "🎯 محدوده دوز مجاز", v: `${item.min_dose || '-'} تا ${item.max_dose || '-'} ${item.unit || ''}` },
        { t: "📦 اشکال و غلظت دارویی", v: item.forms_and_concentrations },
        { t: "🔄 دستور تیتر و اثرات بالینی", v: item.titration },
        { t: "💉 نحوه و مسیر تجویز", v: item.administration },
        { t: "✅ حلال‌ها و سازگاری سرمی", v: item.solutions_compatible },
        { t: "🚫 موارد منع مصرف قطعی", v: item.contraindications },
        { t: "🫄 بارداری و شیردهی", v: item.pregnancy_lactation },
        { t: "🩺 عوارض جانبی پرخطر", v: item.side_effects },
        { t: "⚠️ هشدارها و نکات کلیدی", v: item.notes },
        { t: "🧪 ناسازگاری‌های لاین تزریق (Y-Site)", v: item.y_site_incompatible }
      ];

      let html = `
        <div class="detail-header-card">
          <h2 style="color:var(--accent-title); font-size:16px; margin-bottom:4px;">💊 ${faName}</h2>
          <p style="opacity:0.8; font-size:12px;"><i>${enName}</i></p>
        </div>
      `;

      for (const sec of secKeys) {
        if (sec.v) {
          html += `
            <div class="section-box">
              <div class="section-title">${sec.t}</div>
              <div class="section-desc">${sec.v}</div>
            </div>
          `;
        }
      }

      dc.innerHTML = html;
      dv.style.display = 'block';
    }

    function closeDetail() {
      document.getElementById('detail-view').style.display = 'none';
    }

    loadData();
  </script>
</body>
</html>
